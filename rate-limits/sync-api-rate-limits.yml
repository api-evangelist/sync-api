description: >-
  Measured rate-limit record for Sync API. Sync API documents NO rate limits, and
  publishes no developer documentation in which limits could appear. This file
  supersedes a 2026-05-04 bulk-sweep scaffold that carried invented per-tier
  limits (10/100/1000 rpm) and an invented X-RateLimit-* header contract; none of
  those were ever published or observed, and they have been removed.
limit_count: 0
