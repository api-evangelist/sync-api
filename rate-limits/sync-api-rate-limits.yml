responseCodes: {}
findings:
  - url: https://sync-api.com/
    status: 200
    finding: >-
      The public site is five pages (Home, About Us, Our Services, Partnerships,
      Contact Us) of marketing copy. There is no developer portal, API reference,
      or terms page that states a request quota, burst allowance, throttle window,
      or 429 behaviour.
  - url: https://sync-api.com/docs
    status: 404
    finding: No documentation surface exists on which limits could be published.
  - url: https://api.sync-api.com
    status: 0
    finding: >-
      NXDOMAIN across 8.8.8.8, 1.1.1.1 and 9.9.9.9. No live response could be
      observed, so no rate-limit response headers could be probed either.
notes:
  - >-
    Because the API host does not resolve, limits could not be established by
    observation as well as not by documentation. Both routes are closed.
  - >-
    No RateLimits pointer is emitted in apis.yml — a pointer asserts the provider
    publishes limits, and the measured answer is zero.
