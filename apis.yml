x-coverage:
  state: none
  reason: no-developer-program
  detail: >-
    Sync API markets itself as an "Enterprise API for the In-App advertising
    ecosystem" but ships no developer surface at all: the site is a five-page
    WordPress brochure with no docs, no reference, no signup and no SDKs, and the
    API host it advertised, api.sync-api.com, is authoritative NXDOMAIN on
    8.8.8.8, 1.1.1.1 and 9.9.9.9 — so the placeholder baseURL was removed from
    this file. Every spec and /.well-known/ path returns the WordPress 404
    template; the only machine-readable surface on the domain is the marketing
    site's own WordPress REST API (/wp-json/, 268 CMS routes) and an auth-gated
    (401) WordPress MCP-adapter route, neither of which is the advertising
    product.
  evidence:
    - url: https://api.sync-api.com
      status: 0
    - url: https://sync-api.com/openapi.json
      status: 404
    - url: https://sync-api.com/.well-known/agent-card.json
      status: 404
    - url: https://sync-api.com/docs
      status: 404
    - url: https://sync-api.com/wp-json/mcp/mcp-adapter-default-server
      status: 401
    - url: https://sync-api.com/
      status: 200
  checked: '2026-08-12'
