description: >-
  Measured plans and pricing record for Sync API. Sync API publishes NO API plans
  or pricing. This file supersedes a 2026-05-04 bulk-sweep scaffold that carried
  invented Free/Professional/Enterprise tiers with invented quotas; those values
  were never published by the provider and have been removed.
plan_count: 0
plans: []
findings:
  - url: https://sync-api.com/pricing-plans/
    status: 200
    finding: >-
      The page exists and is reachable, but it is unmodified WordPress theme demo
      content, not Sync API's pricing. It advertises "Basic / Standart / Premium"
      SEO-agency packages at $24.50 / $59.90 / $89.50 with feature bullets
      ("SEO Audits", "Link Building", "Site Migration") that have nothing to do
      with in-app advertising, and the contact block still carries the theme's
      placeholders (email@example.com, email@yoursite.com, phone
      "8 800 2534 236"). The page is not linked from the site navigation. It is
      NOT a pricing disclosure and must not be read as one.
  - url: https://sync-api.com/
    status: 200
    finding: >-
      The site's only commercial call to action on every page is "Get in touch" /
      "Contact Us". No plan names, prices, quotas, tiers, trial, or overage terms
      appear anywhere in the four real pages (Home, About Us, Our Services,
      Partnerships, Contact Us).
  - url: https://api.sync-api.com
    status: 0
    finding: >-
      NXDOMAIN. There is no API host, therefore no metered surface a plan could
      price.
notes:
  - >-
    Access model is relationship-based: pricing is negotiated through the contact
    form / support@sync-api.com. Not an enterprise "contact sales" pricing page —
    there is no pricing page at all for the advertising product.
  - >-
    No Plans pointer is emitted in apis.yml. A pointer asserts the provider
    publishes plans; the measured answer here is zero.
